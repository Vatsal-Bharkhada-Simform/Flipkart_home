<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart</title>

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="header">
        <div class="header__wrapper">
            <div class="header__wrapper-left">
                <a href="#" class="header__icon-link" aria-label="Go to home">
                    <svg>
                        <use href="./assets/icons/flipkart.svg"></use>
                    </svg>
                </a>
                <form action="#" class="header__search">
                    <input type="search" name="search" id="search" aria-label="Search for products, brands and more." placeholder="Search for products, brands and more">
                    <button type="submit" aria-label="Submit search query">
                        <svg>
                            <use href="./assets/icons/sprite.svg#search"></use>
                        </svg>
                    </button>
                </form>
            </div>
            <div class="header__wrapper-right">
                <a href="#" class="u-button button-login" aria-label="Login to flipkart">
                    Login
                </a>
                <button class="u-button button-icon" aria-label="View more options" type="button">
                    More
                    <svg class="u-chevron-down">
                        <use href="/assets/icons/sprite.svg#chevron-down"></use>
                    </svg>
                </button>
                <a href="#" class="u-button button-icon" aria-label="Go to Cart">
                    <svg>
                        <use href="./assets/icons/sprite.svg#cart"></use>
                    </svg>
                    Cart
                </a>
            </div>
        </div>
    </header>
    <nav class="categories">
        <ul class="categories__list">
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Top offers">
                    <img src="./assets/images/offers.png" alt="Top offers">
                    <span class="item-name">
                        Top Offers
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Grocery">
                    <img src="./assets/images/grocery.png" alt="Grocery">
                    <span class="item-name">
                        Grocery
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Mobiles">
                    <img src="./assets/images/mobiles.png" alt="Mobiles">
                    <span class="item-name">
                        Mobiles
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Fashion">
                    <img src="./assets/images/fashion.png" alt="Fashion">
                    <span class="item-name">
                        Fashion
                        <svg class="u-chevron-down">
                            <use href="./assets/icons/sprite.svg#chevron-down"></use>
                        </svg>
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Electronics">
                    <img src="./assets/images/electronics.png" alt="Electronics">
                    <span class="item-name">
                        Electronics
                        <svg class="u-chevron-down">
                            <use href="./assets/icons/sprite.svg#chevron-down"></use>
                        </svg>
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Home">
                    <img src="./assets/images/home.png" alt="Home">
                    <span class="item-name">
                        Home
                        <svg class="u-chevron-down">
                            <use href="./assets/icons/sprite.svg#chevron-down"></use>
                        </svg>
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Appliances">
                    <img src="./assets/images/appliances.png" alt="Appliances">
                    <span class="item-name">
                        Appliances
                        <svg class="u-chevron-down">
                            <use href="./assets/icons/sprite.svg#chevron-down"></use>
                        </svg>
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Travel">
                    <img src="./assets/images/travel.png" alt="Travel">
                    <span class="item-name">
                        Travel
                    </span>
                </a>
            </li>
            <li class="categories__list-item">
                <a href="#" class="list__item-link" aria-label="Beauty, Toys & More">
                    <img src="./assets/images/toys.png" alt="Beauty, Toys & More">
                    <span class="item-name">
                        Beauty, Toys & More
                        <svg class="u-chevron-down">
                            <use href="./assets/icons/sprite.svg#chevron-down"></use>
                        </svg>
                    </span>
                </a>
            </li>
        </ul>
    </nav>
    <main class="main__content">
        <section class="section__deals">
            <div class="deals__wrapper"></div>
            <div class="advertisement"></div>
        </section>
        <section class="section__books-and-instruments"></section>
    </main>
</body>
</html>
